# W5.12 Parte 1 — Stack DesarrollosMX para desarrollo local.
# El runtime de produccion (Kubernetes / Emergent platform) gestiona los servicios
# mediante manifiestos propios; este archivo describe la topologia esperada y
# permite levantar Neo4j para el Knowledge Graph en entornos dev/staging.
version: "3.9"

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: dmx-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme_in_prod}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_dbms_memory_pagecache_size: "512m"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test:
        - "CMD-SHELL"
        - "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-changeme_in_prod} 'RETURN 1' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - dmx-net

  backend:
    build: ./backend
    container_name: dmx-backend
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-desarrollosmx}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme_in_prod}
    ports:
      - "8001:8001"
    networks:
      - dmx-net

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

networks:
  dmx-net:
    driver: bridge
