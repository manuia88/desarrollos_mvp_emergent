name: CI Smoke

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-syntax:
    name: Backend Syntax + Imports
    runs-on: ubuntu-latest
    # CI hardening 2026-05-13: removido continue-on-error: true que enmascaraba
    # fallos de pytest como success. Ahora si pytest falla, job rojo (correcto).
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps (skip emergent-private)
        run: |
          cd backend
          grep -v "^emergentintegrations" requirements.txt > /tmp/req-ci.txt
          pip install -r /tmp/req-ci.txt

      - name: Syntax check server.py
        run: python -m py_compile backend/server.py

      - name: Syntax check all routes/
        run: |
          for f in backend/routes/*.py; do
            python -m py_compile "$f" || exit 1
          done
          echo "All $(ls backend/routes/*.py | wc -l) route files compile OK"

      - name: Syntax check all engines + helpers
        run: |
          fail=0
          for f in backend/*.py; do
            python -m py_compile "$f" 2>&1 || fail=1
          done
          if [ "$fail" = "0" ]; then
            echo "All backend files compile OK"
          else
            echo "ERROR: some files failed compile" && exit 1
          fi

      - name: Run unit tests (Wave 1+ · no infra needed)
        # CI hardening 2026-05-13: removido "| tail -80" que ocultaba exit code real de pytest.
        # Ahora si pytest falla, step rojo. --continue-on-collection-errors permite que
        # archivos con import errors no aborten suite, pero errors quedan visibles.
        run: |
          cd backend
          pytest -m unit -v \
            --continue-on-collection-errors \
            --ignore=tests/test_api.py \
            --ignore=tests/wave4/test_brochure_engine_unit.py \
            --ignore=tests/wave4/test_brochure_renderer_unit.py \
            --ignore=tests/wave4/test_free_audit_engine_unit.py \
            --ignore=tests/wave4/test_newsletter_pulse_engine_unit.py \
            --ignore=tests/wave4/test_state_of_cdmx_engine_unit.py \
            --ignore=tests/wave4/test_tour_3dgs_engine_unit.py

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    # CI hardening 2026-05-13: removido continue-on-error · ahora si yarn build falla, job rojo.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend deps
        run: |
          cd frontend
          yarn install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          yarn build
        env:
          CI: false
