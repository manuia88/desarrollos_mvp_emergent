        - heading "Lo que siempre preguntan antes de confiar." [level=2] [ref=e1811]
        - paragraph [ref=e1812]: Cómo armamos los scores, de dónde vienen los datos y cómo cuidamos lo que nos compartes.
        - button "Hablar con un asesor verificado" [ref=e1813] [cursor=pointer]:
          - img [ref=e1814]
          - text: Hablar con un asesor verificado
      - generic [ref=e1816]:
        - generic [ref=e1817]:
          - button "¿Qué separa a DMX de un portal como Lamudi o Inmuebles24?" [ref=e1818] [cursor=pointer]:
            - generic [ref=e1819]: ¿Qué separa a DMX de un portal como Lamudi o Inmuebles24?
            - img [ref=e1821]
          - paragraph [ref=e1824]: "Un portal monetiza listados; DMX monetiza decisiones. Procesamos más de 97 variables por barrio desde fuentes oficiales (DENUE, FGJ, GTFS, SEDUVI, Atlas de Riesgos) para que tengas una lectura auditable antes de firmar. No somos catálogo: somos la capa de inteligencia sobre la que los catálogos deberían descansar."
        - generic [ref=e1825]:
          - button "¿De dónde salen los datos y cada cuánto se refrescan?" [ref=e1826] [cursor=pointer]:
            - generic [ref=e1827]: ¿De dónde salen los datos y cada cuánto se refrescan?
            - img [ref=e1829]
          - paragraph [ref=e1831]: Todas las fuentes son públicas y oficiales. El refresco es semanal automatizado, con checksum para detectar cambios de esquema. Cada indicador lleva metadatos de origen y fecha de extracción — puedes clicar hasta el CSV fuente.
        - generic [ref=e1832]:
          - button "¿Qué miden exactamente Vida, Movilidad, Seguridad y Comercio?" [ref=e1833] [cursor=pointer]:
            - generic [ref=e1834]: ¿Qué miden exactamente Vida, Movilidad, Seguridad y Comercio?
            - img [ref=e1836]
          - paragraph [ref=e1838]: Son los cuatro scores compuestos 0–100 de DMX. Vida integra parques, ruido, amenidades y calidad del aire; Movilidad suma cobertura de Metro/Metrobús/Ecobici y tiempos; Seguridad cruza FGJ con cobertura C5 y alumbrado; Comercio mide densidad DENUE por manzana. Cada score publica su receta y pesos.
        - generic [ref=e1839]:
          - button "Si no cobran comisión por venta, ¿cómo se sostienen?" [ref=e1840] [cursor=pointer]:
            - generic [ref=e1841]: Si no cobran comisión por venta, ¿cómo se sostienen?
            - img [ref=e1843]
          - paragraph [ref=e1845]: "Tres líneas: suscripción Asesor y Desarrolladora, Comprador Premium para fichas con reporte completo, y APIs B2B para bancos y FIBRAs. Cero comisión transaccional significa cero conflicto de interés al momento de mostrarte un dato incómodo."
        - generic [ref=e1846]:
          - button "¿Cuántos barrios tienen IE Score completo hoy?" [ref=e1847] [cursor=pointer]:
            - generic [ref=e1848]: ¿Cuántos barrios tienen IE Score completo hoy?
            - img [ref=e1850]
          - paragraph [ref=e1852]: H1 2026 cubrimos 16 barrios de alta actividad residencial en CDMX. H2 escalamos a los 133 barrios completos de la ciudad e iniciamos Monterrey y Guadalajara. Dubai y Miami entran en 2027.
        - generic [ref=e1853]:
          - button "¿La plusvalía proyectada es una promesa de retorno?" [ref=e1854] [cursor=pointer]:
            - generic [ref=e1855]: ¿La plusvalía proyectada es una promesa de retorno?
            - img [ref=e1857]
          - paragraph [ref=e1859]: No. Es una estimación estadística con regresión a 24 meses y bandas de confianza explícitas. Publicamos RMSE histórico por barrio para que puedas medir qué tan afilada es nuestra lectura antes de incorporarla a tu tesis.
        - generic [ref=e1860]:
          - button "¿Cómo confirmo que un asesor es realmente de DMX?" [ref=e1861] [cursor=pointer]:
            - generic [ref=e1862]: ¿Cómo confirmo que un asesor es realmente de DMX?
            - img [ref=e1864]
          - paragraph [ref=e1866]: Cada asesor publica su cédula AMPI, historial transparente de operaciones y score de reputación auditado. Puedes contactarlo desde la ficha de propiedad o desde cualquier reporte de barrio — siempre bajo el escudo de verificación DMX.
