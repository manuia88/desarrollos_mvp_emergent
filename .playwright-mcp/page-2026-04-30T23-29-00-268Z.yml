    - generic [ref=e1814]:
      - generic [ref=e1816]:
        - generic [ref=e1817]: Frequent questions
        - heading "What people always ask before they trust us." [level=2] [ref=e2025]
        - paragraph [ref=e1819]: How we build the scores, where the data comes from and how we protect what you share.
        - button "Talk to a verified advisor" [ref=e2026] [cursor=pointer]:
          - img [ref=e1821]
          - text: Talk to a verified advisor
      - generic [ref=e1823]:
        - generic [ref=e1824]:
          - button "What separates DMX from a portal like Lamudi or Inmuebles24?" [ref=e2027] [cursor=pointer]:
            - generic [ref=e1826]: What separates DMX from a portal like Lamudi or Inmuebles24?
            - img [ref=e1828]
          - paragraph [ref=e1831]: "A portal monetizes listings; DMX monetizes decisions. We process more than 97 variables per neighborhood from official sources (DENUE, FGJ, GTFS, SEDUVI, Risk Atlas) so you have an auditable reading before signing. We are not a catalog: we are the intelligence layer catalogs should rest on."
        - generic [ref=e1832]:
          - button "Where does the data come from and how often is it refreshed?" [ref=e2028] [cursor=pointer]:
            - generic [ref=e1834]: Where does the data come from and how often is it refreshed?
            - img [ref=e1836]
          - paragraph [ref=e1838]: All sources are public and official. The refresh is automated weekly, with checksums to detect schema drift. Each indicator ships with origin metadata and extraction date — you can click down to the source CSV.
        - generic [ref=e1839]:
          - button "What exactly do Livability, Mobility, Safety and Commerce measure?" [ref=e2029] [cursor=pointer]:
            - generic [ref=e1841]: What exactly do Livability, Mobility, Safety and Commerce measure?
            - img [ref=e1843]
          - paragraph [ref=e1845]: They are DMX's four composite 0–100 scores. Livability integrates parks, noise, amenities and air quality; Mobility adds Metro/Metrobús/Ecobici coverage and commute times; Safety crosses FGJ with C5 coverage and lighting; Commerce measures DENUE density per block. Each score publishes its recipe and weights.
        - generic [ref=e1846]:
          - button "If you do not charge sales commission, how do you sustain?" [ref=e2030] [cursor=pointer]:
            - generic [ref=e1848]: If you do not charge sales commission, how do you sustain?
            - img [ref=e1850]
          - paragraph [ref=e1852]: "Three lines: Advisor and Developer subscription, Premium Buyer for full-report listings, and B2B APIs for banks and FIBRAs. Zero transactional commission means zero conflict of interest when we show you an uncomfortable data point."
        - generic [ref=e1853]:
          - button "How many neighborhoods have full IE Score today?" [ref=e2031] [cursor=pointer]:
            - generic [ref=e1855]: How many neighborhoods have full IE Score today?
            - img [ref=e1857]
          - paragraph [ref=e1859]: H1 2026 covers 16 high-activity residential neighborhoods in CDMX. H2 scales to the full 133 city neighborhoods and starts Monterrey and Guadalajara. Dubai and Miami enter in 2027.
        - generic [ref=e1860]:
          - button "Is projected appreciation a return promise?" [ref=e2032] [cursor=pointer]:
            - generic [ref=e1862]: Is projected appreciation a return promise?
            - img [ref=e1864]
          - paragraph [ref=e1866]: No. It is a statistical estimate with 24-month regression and explicit confidence bands. We publish historical RMSE per neighborhood so you can gauge how sharp our reading is before folding it into your thesis.
        - generic [ref=e1867]:
          - button "How do I confirm an advisor is really from DMX?" [ref=e2033] [cursor=pointer]:
            - generic [ref=e1869]: How do I confirm an advisor is really from DMX?
            - img [ref=e1871]
          - paragraph [ref=e1873]: Each advisor publishes AMPI license, transparent operations history and audited reputation score. You can reach them from any listing or neighborhood report — always under the DMX verification shield.
